[project]
name = "__DISTRIBUTION_NAME__"
version = "0.1.0"
description = "__DISPLAY_NAME__ connector plugin for Dander."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "dander-platform>=__DANDER_MIN_VERSION__,<__DANDER_MAX_VERSION__",
]

[project.urls]
Homepage = "https://github.com/YOUR-ACCOUNT/__DISTRIBUTION_NAME__"
Issues = "https://github.com/YOUR-ACCOUNT/__DISTRIBUTION_NAME__/issues"
Repository = "https://github.com/YOUR-ACCOUNT/__DISTRIBUTION_NAME__.git"

[project.entry-points."dander.connectors"]
__PLUGIN_ID__ = "__PACKAGE_NAME__.plugin:create_plugin"

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__PACKAGE_NAME__"]

[tool.hatch.build.targets.sdist]
include = [
  ".github",
  "CHANGELOG.md",
  "HANDOFF.md",
  "LICENSE",
  "README.md",
  "pyproject.toml",
  "src",
  "tests",
  "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
