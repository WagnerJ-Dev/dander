# Greenhouse Harvest v3 for private recruiting data.
# Credential values stay in environment variables or GCP Secret Manager.
name: greenhouse
base_url: https://harvest.greenhouse.io/v3
auth_strategy: oauth2_client_credentials
auth_refs:
  client_id: SECRET_GREENHOUSE_CLIENT_ID
  client_secret: SECRET_GREENHOUSE_CLIENT_SECRET
auth_options:
  token_url: https://auth.greenhouse.io/token

endpoints:
  - name: candidates
    path: /candidates
    pagination: link_header
    incremental_cursor: updated_at
    cursor_param: updated_at[gt]
    primary_key: [id]

  - name: jobs
    path: /jobs
    pagination: link_header
    incremental_cursor: updated_at
    cursor_param: updated_at[gt]
    primary_key: [id]
