# Credential-free access to Ashby's real published Ashby job board.
# Replace `Ashby` with another public Ashby board name if desired.
# Documentation: https://developers.ashbyhq.com/docs/public-job-posting-api
name: ashby_job_board
base_url: https://api.ashbyhq.com/posting-api/job-board
auth_strategy: none
rate_limit:
  requests_per_second: 2
  burst: 1
  backoff: exponential
  max_retries: 3

endpoints:
  - name: jobs
    path: /Ashby
    query_params:
      includeCompensation: true
    pagination: none
    data_selector: jobs
    primary_key: [id]
