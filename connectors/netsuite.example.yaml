# Template only. Every credential below is an environment or Secret Manager reference, never a
# literal. Replace ACCOUNT with the account-specific hostname and account id.
name: netsuite
engine: dlt
base_url: https://ACCOUNT.suitetalk.api.netsuite.com/services/rest/record/v1
auth_strategy: oauth1_tba
auth_refs:
  consumer_key: NETSUITE_CONSUMER_KEY
  consumer_secret: NETSUITE_CONSUMER_SECRET
  token_id: NETSUITE_TOKEN_ID
  token_secret: NETSUITE_TOKEN_SECRET
auth_options:
  account_id: ACCOUNT
endpoints:
  - name: customers
    path: /customer
    data_selector: items
    pagination:
      kind: offset
      offset_param: offset
      limit_param: limit
      page_size: 100
    primary_key: [id]
